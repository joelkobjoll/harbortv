name: Android

# Builds run on the self-hosted runner on Joel's Unraid server (labels: harbortv).
# It keeps ~/.gradle and the Android SDK between runs, so builds are fast and
# do not use GitHub-hosted minutes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, harbortv]
    timeout-minutes: 45
    permissions:
      contents: write   # create the GitHub Release on main
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Read version
        id: version
        run: |
          echo "code=$(grep -E '^VERSION_CODE=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "name=$(grep -E '^VERSION_NAME=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # Secrets are not available to pull requests from forks; those builds
      # fall back to the debug key and are never published.
      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HARBOR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "HARBOR_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::HARBOR_KEYSTORE_BASE64 is not set, building with the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          HARBOR_KEYSTORE_PASSWORD: ${{ secrets.HARBOR_KEYSTORE_PASSWORD }}
          HARBOR_KEY_ALIAS: ${{ secrets.HARBOR_KEY_ALIAS }}
          HARBOR_KEY_PASSWORD: ${{ secrets.HARBOR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Prepare update feed
        run: |
          rm -rf site
          scripts/prepare-update-feed.sh app/build/outputs/apk/release/app-release.apk site

      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: HarborTV-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: site/HarborTV.apk
          retention-days: 14

      # One GitHub Release per version (tag v<VERSION_NAME>), created the first
      # time that version reaches main.
      - name: Create release if new
        continue-on-error: true # Pages can deploy the signed APK if the Releases API is unavailable.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.keystore.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" site/HarborTV.apk site/update.json \
              --title "Harbor TV $TAG (build $CODE)" \
              --notes "Built from ${GITHUB_SHA}. See CHANGELOG.md." \
              --target "$GITHUB_SHA"
          fi

      - name: Upload Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.keystore.outputs.signed == 'true' && !github.event.repository.private
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Publishes HarborTV.apk + update.json to GitHub Pages (public repo only).
  # Boxes only install an update when VERSION_CODE is higher than what they run.
  publish-feed:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true' && !github.event.repository.private
    runs-on: [self-hosted, harbortv]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
