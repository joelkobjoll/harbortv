name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_code: ${{ steps.version.outputs.code }}
      version_name: ${{ steps.version.outputs.name }}
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          echo "code=$(grep -E '^VERSION_CODE=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "name=$(grep -E '^VERSION_NAME=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # Secrets are not available to pull requests from forks; those builds
      # fall back to the debug key and are never published.
      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HARBOR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "HARBOR_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::HARBOR_KEYSTORE_BASE64 is not set, building with the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          HARBOR_KEYSTORE_PASSWORD: ${{ secrets.HARBOR_KEYSTORE_PASSWORD }}
          HARBOR_KEY_ALIAS: ${{ secrets.HARBOR_KEY_ALIAS }}
          HARBOR_KEY_PASSWORD: ${{ secrets.HARBOR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease

      - name: Prepare update feed
        run: scripts/prepare-update-feed.sh app/build/outputs/apk/release/app-release.apk site

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: HarborTV-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: site/HarborTV.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.keystore.outputs.signed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishes HarborTV.apk + update.json to GitHub Pages. Boxes only install an
  # update when VERSION_CODE is higher than what they run, so pushes that do not
  # bump the version are harmless.
  publish-feed:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Creates a GitHub Release (tag v<VERSION_NAME>) the first time a version
  # reaches main, so every shipped build is archived.
  release:
    needs: [build, publish-feed]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: HarborTV-${{ needs.build.outputs.version_name }}-${{ needs.build.outputs.version_code }}
          path: dist
      - name: Create release if new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version_name }}
          CODE: ${{ needs.build.outputs.version_code }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi
          gh release create "$TAG" dist/HarborTV.apk \
            --title "Harbor TV $TAG (build $CODE)" \
            --notes "Built from ${GITHUB_SHA}. See CHANGELOG.md." \
            --target "$GITHUB_SHA"
