android.useAndroidX=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Release version. Bumping VERSION_CODE on main ships an update to every box.
VERSION_CODE=49
VERSION_NAME=1.48

# Default update feed baked into new installs (users can change or clear it in
# Portal settings > Software updates).
UPDATE_FEED_URL=https://joelkobjoll.github.io/harbortv/update.json
